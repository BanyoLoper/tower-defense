<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="Secuencia de un cambio de estado" role="img" viewbox="0 0 960 360" width="960" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="sq" markerheight="8" markerwidth="8" orient="auto" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#44506b"></path></marker></defs><g font-family="system-ui,Arial,sans-serif" font-size="12"><rect fill="#e8f0ff" height="32" rx="8" stroke="#1f5fd6" stroke-width="2" width="140" x="40" y="10"></rect><text font-weight="700" text-anchor="middle" x="110" y="31">Controller</text><path d="M110,42 L110,350" stroke="#99a3b8" stroke-dasharray="5 4"></path><rect fill="#e8f0ff" height="32" rx="8" stroke="#1f5fd6" stroke-width="2" width="140" x="260" y="10"></rect><text font-weight="700" text-anchor="middle" x="330" y="31">Maquina</text><path d="M330,42 L330,350" stroke="#99a3b8" stroke-dasharray="5 4"></path><rect fill="#e8f0ff" height="32" rx="8" stroke="#1f5fd6" stroke-width="2" width="140" x="480" y="10"></rect><text font-weight="700" text-anchor="middle" x="550" y="31">Estado A</text><path d="M550,42 L550,350" stroke="#99a3b8" stroke-dasharray="5 4"></path><rect fill="#e8f0ff" height="32" rx="8" stroke="#1f5fd6" stroke-width="2" width="140" x="720" y="10"></rect><text font-weight="700" text-anchor="middle" x="790" y="31">Estado B</text><path d="M790,42 L790,350" stroke="#99a3b8" stroke-dasharray="5 4"></path><path d="M110,70 L324,70" marker-end="url(#sq)" stroke="#44506b" stroke-width="1.6"></path><text fill="#1d2433" text-anchor="middle" x="220" y="64">Actualizar(dt)</text><path d="M330,110 L544,110" marker-end="url(#sq)" stroke="#44506b" stroke-width="1.6"></path><text fill="#1d2433" text-anchor="middle" x="440" y="104">Actual.Actualizar(dt)</text><path d="M550,150 L336,150" marker-end="url(#sq)" stroke="#44506b" stroke-dasharray="5 4" stroke-width="1.6"></path><text fill="#1d2433" text-anchor="middle" x="440" y="144">devuelve "B"  (null = sigo)</text><path d="M330,200 L544,200" marker-end="url(#sq)" stroke="#44506b" stroke-width="1.6"></path><text fill="#1d2433" text-anchor="middle" x="440" y="194">A.Salir("B")</text><path d="M330,240 L784,240" marker-end="url(#sq)" stroke="#44506b" stroke-width="1.6"></path><text fill="#1d2433" text-anchor="middle" x="560" y="234">B.Entrar("A")</text><rect fill="#fff7e0" height="22" rx="6" stroke="#b86e00" width="150" x="255" y="284"></rect><text text-anchor="middle" x="330" y="299">Actual = Estado B</text><text fill="#5d6679" x="20" y="335">Los eventos externos (muerte, fin de partida) usan Maquina.CambiarA("...") o Maquina.Disparar("trigger"): siguen el mismo camino Salir -&gt; Entrar.</text></g></svg>