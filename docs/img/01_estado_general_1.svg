<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 358" width="760" height="358" aria-label="Ciclo de vida de un estado" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><rect x="0" y="0" width="760" height="358" fill="#ffffff"/><defs><marker id="fa" markerheight="8" markerwidth="8" orient="auto" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#44506b"></path></marker></defs><g fill="#1d2433" font-family="system-ui,Arial,sans-serif" font-size="13" text-anchor="middle"><rect fill="#e8f0ff" height="60" rx="12" stroke="#1f5fd6" stroke-width="2" width="150" x="10" y="120"></rect><text font-weight="700" x="85" y="147">Update() del</text><text font-weight="700" x="85" y="165">controller</text><path d="M160,150 L210,150" marker-end="url(#fa)" stroke="#44506b" stroke-width="1.8"></path><rect fill="#e8f0ff" height="70" rx="12" stroke="#1f5fd6" stroke-width="2" width="170" x="215" y="115"></rect><text font-weight="700" x="300" y="143">Maquina.Actualizar(dt)</text><text fill="#5d6679" font-size="11" x="300" y="163">llama al estado actual</text><path d="M385,150 L435,150" marker-end="url(#fa)" stroke="#44506b" stroke-width="1.8"></path><rect fill="#fff" height="70" rx="12" stroke="#1f5fd6" stroke-width="2" width="170" x="440" y="115"></rect><text font-weight="700" x="525" y="143">estado.Actualizar(dt)</text><text fill="#5d6679" font-size="11" x="525" y="163">tu logica</text><path d="M610,150 L650,150 L650,150" stroke="#44506b" stroke-width="1.8"></path><polygon fill="#fff7e0" points="690,150 740,125 740,175" stroke="#b86e00" stroke-width="2" transform="translate(-40,0)"></polygon><text font-size="12" font-weight="700" x="672" y="154">¿null?</text><path d="M672,110 L672,60" marker-end="url(#fa)" stroke="#44506b" stroke-width="1.8"></path><text font-size="12" x="715" y="85">no (nombre)</text><rect fill="#fff" height="46" rx="12" stroke="#1f5fd6" stroke-width="2" width="195" x="560" y="12"></rect><text font-weight="700" x="657" y="32">CambiarA(nombre)</text><text fill="#5d6679" font-size="11" x="657" y="49">Salir() -&gt; Entrar()</text><path d="M672,190 L672,240" marker-end="url(#fa)" stroke="#44506b" stroke-width="1.8"></path><text font-size="12" x="700" y="222">si</text><rect fill="#f4f6fb" height="44" rx="12" stroke="#99a3b8" stroke-width="2" width="170" x="580" y="242"></rect><text x="665" y="268">sigue en el mismo estado</text><path d="M300,185 L300,290 L40,290 L40,250" fill="none" stroke="#99a3b8" stroke-dasharray="5 4" stroke-width="1.6"></path><rect fill="#fdecea" height="58" rx="12" stroke="#c0392b" stroke-dasharray="6 4" stroke-width="2" width="170" x="10" y="190"></rect><text font-weight="700" x="95" y="214">Evento externo</text><text fill="#5d6679" font-size="11" x="95" y="232">Disparar(trigger) / CambiarA</text><text fill="#5d6679" font-size="11" x="170" y="312">tambien los eventos (muerte, fin de partida) pueden cambiar de estado en cualquier momento</text></g></svg>