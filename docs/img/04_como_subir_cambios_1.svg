"290.0" y="66.0">2. Crear rama</text><text fill="#1d2433" font-size="11" font-weight="400" text-anchor="middle" x="290.0" y="82.0">clase-N/cupo-maquina</text><rect fill="#e8f0ff" height="62" rx="10" stroke="#1f5fd6" stroke-width="2" width="165" x="397.5" y="39.0"></rect><text fill="#1d2433" font-size="13" font-weight="700" text-anchor="middle" x="480.0" y="66.0">3. Programar</text><text fill="#1d2433" font-size="11" font-weight="400" text-anchor="middle" x="480.0" y="82.0">Assets/_Alumnos/&lt;Maq&gt;/</text><rect fill="#e8f0ff" height="62" rx="10" stroke="#1f5fd6" stroke-width="2" width="165" x="587.5" y="39.0"></rect><text fill="#1d2433" font-size="13" font-weight="700" text-anchor="middle" x="670.0" y="66.0">4. Probar en Unity</text><text fill="#1d2433" font-size="11" font-weight="400" text-anchor="middle" x="670.0" y="82.0">Play, consola sin errores</text><rect fill="#fff7e0" height="62" rx="10" stroke="#b86e00" stroke-width="2" width="165" x="777.5" y="39.0"></rect><text fill="#1d2433" font-size="13" font-weight="700" text-anchor="middle" x="860.0" y="66.0">5. Commit</text><text fill="#1d2433" font-size="11" font-weight="400" text-anchor="middle" x="860.0" y="82.0">solo tu carpeta (+ .meta)</text><rect fill="#fff7e0" height="62" rx="10" stroke="#b86e00" stroke-width="2" width="165" x="777.5" y="169.0"></rect><text fill="#1d2433" font-size="13" font-weight="700" text-anchor="middle" x="860.0" y="196.0">6. Push</text><text fill="#1d2433" font-size="11" font-weight="400" text-anchor="middle" x="860.0" y="212.0">git push -u origin rama</text><rect fill="#e6f6ec" height="62" rx="10" stroke="#1e8e4e" stroke-width="2" width="165" x="587.5" y="169.0"></rect><text fill="#1d2433" font-size="13" font-weight="700" text-anchor="middle" x="670.0" y="196.0">7. Crear PR</text><text fill="#1d2433" font-size="11" font-weight="400" text-anchor="middle" x="670.0" y="212.0">el mismo dia de clase</text><rect fill="#f4f6fb" height="62" rx="10" stroke="#99a3b8" stroke-width="2" width="165" x="397.5" y="169.0"></rect><text fill="#1d2433" font-size="13" font-weight="700" text-anchor="middle" x="480.0" y="196.0">8. Revision automatica</text><text fill="#1d2433" font-size="11" font-weight="400" text-anchor="middle" x="480.0" y="212.0">comentario con faltas</text><rect fill="#e6f6ec" height="62" rx="10" stroke="#1e8e4e" stroke-width="2" width="165" x="207.5" y="169.0"></rect><text fill="#1d2433" font-size="13" font-weight="700" text-anchor="middle" x="290.0" y="196.0">9. Aprobacion</text><text fill="#1d2433" font-size="11" font-weight="400" text-anchor="middle" x="290.0" y="212.0">instructor aprueba y mezcla</text><rect fill="#fff" fill-opacity=".94" height="15" rx="4" stroke="#e1e5ef" width="135.4" x="359.5" y="125.0"></rect><text fill="#1d2433" font-size="10.5" text-anchor="middle" x="427.2" y="136.0">faltas: corrige y push</text></g></svg>